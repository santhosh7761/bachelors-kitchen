services:
  mysql:
    image: mysql:8.4
    container_name: bachelors-kitchen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bachelors_kitchen
      MYSQL_USER: bk_user
      MYSQL_PASSWORD: bk_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
