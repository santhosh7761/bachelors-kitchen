services:
  mysql:
    image: mysql:8.4
    container_name: bachelors-kitchen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bachelors_kitchen
      MYSQL_USER: bk_user
      MYSQL_PASSWORD: bk_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bachelors-kitchen-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bachelors_kitchen
      SPRING_DATASOURCE_USERNAME: bk_user
      SPRING_DATASOURCE_PASSWORD: bk_password
    ports:
      - "8080:8080"
    depends_on:
      - mysql
volumes:
  mysql-data:
